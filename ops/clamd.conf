Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
User clamav
DatabaseDirectory /var/lib/clamav
FailIfCvdOlderThan 7
LogTime yes
MaxThreads 2
MaxQueue 8
StreamMaxLength 50M
MaxFileSize 50M
MaxScanSize 100M
MaxRecursion 10
MaxFiles 1000
AlertExceedsMax yes
ReadTimeout 60
CommandReadTimeout 10
SendBufTimeout 60
