# CI gates, cheapest first (build-web-app Book 6): lint → types → unit+integration (real
# Postgres) → production build → HTTP + browser end-to-end → Docker images build and boot.
# Every step runs the same npm scripts a developer runs locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.4"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit & integration tests (Postgres)
    needs: checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/internhub_test?schema=internship
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test

  e2e:
    name: Build + end-to-end (HTTP & browser)
    needs: test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: internhub }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/internhub?schema=internship
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123
      APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run build
      - name: Start production server (same `npm start` developers use)
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && exit 0; sleep 1; done
          echo "server did not become ready"; cat server.log; exit 1
      - name: HTTP end-to-end
        run: npm run db:seed && npm run test:e2e
      - name: Browser end-to-end
        run: |
          pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
          npm run db:seed
          # reset rate-limit counters so the browser run's logins aren't throttled by the HTTP run
          node -e "const R=require('ioredis');const r=new R(process.env.REDIS_URL);r.flushall().then(()=>r.quit())"
          SHOTS_DIR=e2e-shots python scripts/ui-e2e.py
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: e2e-evidence, path: "e2e-shots\nserver.log", retention-days: 14 }

  docker:
    name: Docker images build and boot
    needs: checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: internhub }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images (tagged with the commit)
        run: |
          for t in migrate worker app; do
            docker build --target "$t" -t "internhub-$t:${GITHUB_SHA::12}" .
          done
      - name: Migrate, boot app, probe liveness and readiness
        env:
          DB: postgresql://postgres:postgres@localhost:5432/internhub?schema=internship
        run: |
          docker run --rm --network host -e DATABASE_URL="$DB" "internhub-migrate:${GITHUB_SHA::12}"
          docker run -d --name app --network host -e DATABASE_URL="$DB" \
            -e SESSION_SECRET=ci-only-session-secret-not-used-anywhere-else-0123 "internhub-app:${GITHUB_SHA::12}"
          for i in $(seq 1 30); do curl -sf localhost:3000/api/live && break; sleep 1; done
          curl -sf localhost:3000/api/health | tee /dev/stderr | grep -q '"db":"ok"'
          test "$(docker inspect -f '{{.Config.User}}' app)" = "node"   # non-root
      - if: failure()
        run: docker logs app || true
